[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-face-landmarks"
version = "0.1.0"
description = "Self-supervised Vision Transformer for cat facial landmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["catlandmarks*"]

# On Linux (including CI) install the CPU build of torch: the default Linux wheel
# pulls several gigabytes of CUDA libraries that a machine without a GPU never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0 ; python_full_version >= '3.11'",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
